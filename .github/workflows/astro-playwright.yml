name: Astro Dashboard e2e Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      specs:
        description: 'Selected Playwright spec files'
        required: true
        default: 'tests/login.spec.ts'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # 1. Cache global npm dependencies automatically

      # 2. Cache Playwright Browser Binaries
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: |
          npm ci
          cd dashboard && npm ci

      # 3. Only install browsers and system dependencies if cache missed
      - name: Install Playwright Browsers & OS System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS Dependencies Only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      # 4. Cache Astro Build Cache (.astro directory)
      - name: Cache Astro Build Output
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('dashboard/src/**') }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: Build Astro Dashboard
        run: |
          cd dashboard
          npm run build

      - name: Run Playwright Tests
        run: |
          if [ "${{ github.event.inputs.specs }}" != "" ]; then
            npx playwright test ${{ github.event.inputs.specs }}
          else
            npx playwright test
          fi
        continue-on-error: true

      - name: Bundle Dashboard & Test Report
        run: |
          mkdir -p dashboard/dist/report
          if [ -d "playwright-report" ]; then
            cp -R playwright-report/* dashboard/dist/report/
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4