name: Astro Dashboard e2e Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      specs:
        description: 'Selected Playwright spec files'
        required: true
        default: 'tests/login.spec.ts'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # 1. Cache Playwright Chromium Binaries AND System Deps Indicator
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/package-lock.json') }}

      # 2. Cache Node Modules for Root and Dashboard Together
      - name: Cache Node Modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dashboard/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json', 'dashboard/package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm ci --prefix dashboard

      # 3. Only run install/install-deps when browser cache misses
      - name: Install Chromium & OS System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # 4. Smart Cache for Astro Build Output
      - name: Cache Astro Dist Output
        id: astro-cache
        uses: actions/cache@v4
        with:
          path: dashboard/dist
          key: ${{ runner.os }}-astro-dist-${{ hashFiles('dashboard/src/**', 'dashboard/package-lock.json', 'dashboard/astro.config.*') }}

      - name: Build Astro Dashboard
        if: steps.astro-cache.outputs.cache-hit != 'true'
        run: npm run build --prefix dashboard

      # 5. Run Playwright Tests
      - name: Run Playwright Tests
        run: |
          SPECS="${{ github.event.inputs.specs }}"
          if [ -n "$SPECS" ]; then
            npx playwright test $SPECS --project=chromium --reporter=html
          else
            npx playwright test --project=chromium --reporter=html
          fi
        continue-on-error: true

      # 6. Merge New Test Report into Astro Dist Directory
      - name: Bundle Dashboard & Test Report
        run: |
          mkdir -p dashboard/dist/report
          if [ -d "playwright-report" ]; then
            cp -R playwright-report/* dashboard/dist/report/
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4